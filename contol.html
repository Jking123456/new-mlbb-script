<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINZVAN | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .accent-gradient { background: linear-gradient(135deg, #00e5ff 0%, #007adf 100%); }
        input, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 glass p-6 rounded-2xl">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-cyan-400 uppercase">PRINZVAN ULTIMATE</h1>
                <p class="text-slate-400 text-sm">Multi-Device Redis System v3.0</p>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="glass p-6 rounded-2xl sticky top-8">
                    <h2 class="text-xl font-semibold mb-6 flex items-center"><i class="fa-solid fa-plus-circle mr-3 text-cyan-400"></i> Create Key</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-xs text-slate-500 uppercase mb-2">Duration</label>
                            <select id="duration" class="w-full p-3 rounded-xl outline-none">
                                <option value="1">1 Day</option>
                                <option value="7">7 Days</option>
                                <option value="30" selected>30 Days</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-500 uppercase mb-2">Max Devices</label>
                            <input type="number" id="deviceLimit" value="1" min="1" class="w-full p-3 rounded-xl outline-none">
                        </div>
                        <button onclick="generateKey()" class="w-full accent-gradient hover:opacity-90 text-white font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95">GENERATE KEY</button>
                    </div>
                    <div id="resultBox" class="mt-6 hidden">
                        <div class="bg-cyan-500/10 border border-cyan-500/50 p-4 rounded-xl text-center">
                            <p class="text-xs text-cyan-400 font-bold mb-1">NEW KEY CREATED</p>
                            <code id="newKeyDisplay" onclick="copyKey()" class="text-lg font-mono text-white cursor-pointer hover:text-cyan-400 transition">--------</code>
                        </div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-2">
                <div class="glass p-6 rounded-2xl min-h-[400px]">
                    <h2 class="text-xl font-semibold mb-6">Active Licenses</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead>
                                <tr class="text-slate-500 border-b border-slate-700">
                                    <th class="pb-4">Key String</th>
                                    <th class="pb-4">Devices</th>
                                    <th class="pb-4">Expires</th>
                                    <th class="pb-4 text-right">Action</th>
                                </tr>
                            </thead>
                            <tbody id="keyTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchKeys() {
            try {
                const res = await fetch('/api/manage');
                const data = await res.json();
                const tbody = document.getElementById('keyTableBody');
                tbody.innerHTML = data.keys.map(k => `
                    <tr class="border-b border-slate-800/50 hover:bg-white/5 transition">
                        <td class="py-4 font-mono text-cyan-200">${k.key}</td>
                        <td class="py-4 font-bold text-slate-300">${k.used} / ${k.limit}</td>
                        <td class="py-4 text-slate-500">${Math.round(k.expiry / 3600)}h left</td>
                        <td class="py-4 text-right">
                            <button onclick="deleteKey('${k.key}')" class="text-red-500 hover:text-red-400 p-2"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) { console.error("Load failed"); }
        }

        async function generateKey() {
            const duration = document.getElementById('duration').value;
            const limit = document.getElementById('deviceLimit').value;
            const res = await fetch('/api/manage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ duration, limit })
            });
            const data = await res.json();
            document.getElementById('newKeyDisplay').innerText = data.key;
            document.getElementById('resultBox').classList.remove('hidden');
            fetchKeys();
        }

        async function deleteKey(key) {
            if(!confirm("Delete key and reset all linked devices?")) return;
            await fetch('/api/manage?key=' + key, { method: 'DELETE' });
            fetchKeys();
        }

        function copyKey() {
            const text = document.getElementById('newKeyDisplay').innerText;
            navigator.clipboard.writeText(text);
            alert("Copied: " + text);
        }

        fetchKeys();
    </script>
</body>
</html>
