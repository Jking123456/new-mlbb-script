<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINZVAN | License Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { background-color: #0b0f1a; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-glow { background: linear-gradient(135deg, #2563eb, #3b82f6); box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        .key-box { border: 1px dashed #3b82f6; background: rgba(59, 130, 246, 0.05); }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="p-6">

    <div class="w-full max-w-md">
        <div class="glass rounded-[32px] p-8 text-center shadow-2xl border border-white/5">
            
            <div id="statusIcon" class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-bolt text-3xl text-blue-500"></i>
            </div>

            <h1 id="title" class="text-2xl font-bold mb-2">Free 24h Access</h1>
            <p id="description" class="text-slate-400 text-sm mb-8">Complete the shortlink to generate your key.</p>

            <div id="generateSection" class="space-y-4">
                <button onclick="handleFlow()" id="mainBtn" class="w-full btn-glow text-white font-bold py-4 rounded-xl transition-all">
                    GENERATE SHORTLINK
                </button>
                <p id="tip" class="text-[10px] text-blue-400 hidden mt-4 animate-pulse uppercase tracking-widest">Click again to proceed</p>
            </div>

            <div id="successSection" class="hidden">
                <div class="key-box p-5 rounded-2xl font-mono text-2xl text-white tracking-widest mb-4">
                    <span id="keyText">-------</span>
                </div>
                <button onclick="copyKey()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg">
                    COPY LICENSE KEY
                </button>
                <p class="text-[10px] text-amber-500 mt-4 font-bold uppercase tracking-tighter animate-pulse-slow">
                    ⚠️ DO NOT REFRESH. Copy the key now.
                </p>
            </div>

        </div>
    </div>

    <script>
        let readyLink = "";

        // Obfuscation: Unscramble the payload from verify-claim.js
        function demask(payload) {
            try {
                const reversed = payload.split('').reverse().join('');
                return atob(reversed);
            } catch (e) { return "INVALID_PAYLOAD"; }
        }

        window.onload = async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const urlKey = urlParams.get('key');

            if (urlKey) {
                // 1. IMMEDIATELY clean the URL bar [Invisible Mode]
                window.history.replaceState({}, document.title, window.location.pathname);

                // 2. Start Verification UI
                document.getElementById('generateSection').classList.add('hidden');
                document.getElementById('title').innerText = "Securing Connection...";
                document.getElementById('description').innerText = "Verifying your shortlink completion...";

                try {
                    const res = await fetch(`/api/verify-claim?key=${urlKey}`);
                    const data = await res.json();

                    if (data.success) {
                        const realKey = demask(data.payload);
                        showSuccessMode(realKey);
                    } else {
                        alert("Security Violation: Bypass or Expired Link.");
                        window.location.replace('/keygen.html');
                    }
                } catch (e) {
                    window.location.replace('/keygen.html');
                }
            }
        };

        async function handleFlow() {
            const btn = document.getElementById('mainBtn');
            const tip = document.getElementById('tip');
            if (readyLink) { window.location.href = readyLink; return; }

            btn.innerText = "REQUESTING...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/keygen', { method: 'POST' });
                const data = await res.json();
                if (data.shortlink) {
                    readyLink = data.shortlink;
                    btn.innerText = "PROCEED TO LINK";
                    btn.classList.replace('btn-glow', 'bg-blue-600');
                    btn.disabled = false;
                    tip.classList.remove('hidden');
                }
            } catch (e) {
                alert("Error connecting to server.");
                btn.innerText = "GENERATE SHORTLINK";
                btn.disabled = false;
            }
        }

        function showSuccessMode(key) {
            document.getElementById('generateSection').classList.add('hidden');
            document.getElementById('successSection').classList.remove('hidden');
            
            document.getElementById('statusIcon').innerHTML = '<i class="fa-solid fa-shield-check text-3xl text-green-500"></i>';
            document.getElementById('statusIcon').className = "w-20 h-20 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-6";
            
            document.getElementById('title').innerText = "Verified!";
            document.getElementById('description').innerText = "License generated successfully.";
            document.getElementById('keyText').innerText = key;
        }

        function copyKey() {
            const text = document.getElementById('keyText').innerText;
            navigator.clipboard.writeText(text);
            alert("Key copied! Do not close this page until it is pasted.");
        }
    </script>
</body>
</html>
