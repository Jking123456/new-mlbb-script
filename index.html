<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINZVAN | Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .accent-gradient { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); transition: all 0.3s ease; }
        .accent-gradient:hover { box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); transform: translateY(-1px); }
        input, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="loginSection" class="w-full max-w-md p-4">
        <div class="glass rounded-[24px] p-10 shadow-2xl">
            <div class="flex flex-col items-center mb-8">
                <div class="w-16 h-16 bg-blue-600/10 border border-blue-500/30 rounded-2xl flex items-center justify-center mb-4">
                    <i class="fa-solid fa-shield-halved text-2xl text-blue-500"></i>
                </div>
                <h1 class="text-3xl font-bold text-white text-center">Admin Panel</h1>
            </div>
            <div class="space-y-6">
                <input type="text" id="adminUser" placeholder="Username" class="w-full px-4 py-3 rounded-xl">
                <input type="password" id="adminPass" placeholder="Password" class="w-full px-4 py-3 rounded-xl">
                <button onclick="attemptLogin()" id="loginBtn" class="w-full accent-gradient text-white font-bold py-4 rounded-xl">Sign In</button>
            </div>
        </div>
    </div>

    <div id="dashboardSection" class="hidden w-full max-w-6xl mx-auto p-4 md:p-8 self-start">
        <header class="flex justify-between items-center mb-8 glass p-6 rounded-2xl">
            <h1 class="text-2xl font-bold text-blue-500">PRINZVAN DASHBOARD</h1>
            <button onclick="location.reload()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-power-off"></i></button>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="glass p-6 rounded-2xl h-fit">
                <h2 class="text-xl font-semibold mb-6 text-white">Create Key</h2>
                <div class="space-y-4">
                    <select id="duration" class="w-full p-3 rounded-xl">
                        <option value="1">1 Day</option>
                        <option value="7">7 Days</option>
                        <option value="30" selected>30 Days</option>
                    </select>
                    <input type="number" id="deviceLimit" value="1" class="w-full p-3 rounded-xl">
                    <button onclick="generateKey()" class="w-full accent-gradient py-4 rounded-xl font-bold">GENERATE</button>
                </div>
                <div id="resultBox" class="mt-6 hidden bg-blue-500/10 p-4 rounded-xl text-center border border-blue-500/30">
                    <code id="newKeyDisplay" onclick="copyKey()" class="text-lg font-mono text-white cursor-pointer">--------</code>
                </div>
            </div>

            <div class="lg:col-span-2 glass p-6 rounded-2xl min-h-[500px]">
                <table class="w-full text-left text-sm">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800">
                            <th class="pb-4">Key</th>
                            <th class="pb-4">Usage</th>
                            <th class="pb-4">Status</th>
                            <th class="pb-4 text-right">Action</th>
                        </tr>
                    </thead>
                    <tbody id="keyTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let adminSecret = "";

        async function attemptLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            const res = await fetch('/api/admin', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user, pass })
            });
            if (res.ok) {
                const data = await res.json();
                adminSecret = data.secret;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
                document.body.classList.remove('flex', 'items-center', 'justify-center');
                fetchKeys();
            } else { alert("Login Failed"); }
        }

        async function fetchKeys() {
            const res = await fetch('/api/manage', { headers: { 'x-admin-secret': adminSecret } });
            const data = await res.json();
            const tbody = document.getElementById('keyTableBody');
            tbody.innerHTML = data.keys.map(k => `
                <tr class="border-b border-slate-800/50 hover:bg-white/5 transition">
                    <td class="py-4 font-mono text-blue-300">${k.key}</td>
                    <td class="py-4 text-slate-300">${k.used}/${k.limit}</td>
                    <td class="py-4">
                        <button onclick="togglePremium('${k.key}')" class="px-3 py-1 rounded-lg text-xs font-bold ${k.isPremium ? 'bg-green-500/20 text-green-400 border border-green-500/50' : 'bg-amber-500/20 text-amber-400 border border-amber-500/50'}">
                            ${k.isPremium ? 'PREMIUM' : 'PENDING'}
                        </button>
                    </td>
                    <td class="py-4 text-right">
                        <button onclick="deleteKey('${k.key}')" class="text-red-500"><i class="fa-solid fa-trash-can"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function togglePremium(key) {
            await fetch('/api/manage', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret },
                body: JSON.stringify({ key })
            });
            fetchKeys();
        }

        async function generateKey() {
            const duration = document.getElementById('duration').value;
            const limit = document.getElementById('deviceLimit').value;
            const res = await fetch('/api/manage', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': adminSecret },
                body: JSON.stringify({ duration, limit })
            });
            const data = await res.json();
            if (data.key) {
                document.getElementById('newKeyDisplay').innerText = data.key;
                document.getElementById('resultBox').classList.remove('hidden');
                fetchKeys();
            }
        }

        async function deleteKey(key) {
            if(!confirm("Delete key?")) return;
            await fetch('/api/manage?key=' + key, { method: 'DELETE', headers: { 'x-admin-secret': adminSecret } });
            fetchKeys();
        }

        function copyKey() {
            navigator.clipboard.writeText(document.getElementById('newKeyDisplay').innerText);
            alert("Copied!");
        }
    </script>
</body>
</html>
