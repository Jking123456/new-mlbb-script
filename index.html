<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Prinzvan Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #020617; }
        .glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="min-h-screen text-slate-300 font-sans selection:bg-blue-500/30">

    <div class="max-w-4xl mx-auto px-4 py-8 md:py-12 space-y-8">
        
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Dashboard</h1>
                <p class="text-xs text-slate-500 mt-1">Manage your license keys and system status</p>
            </div>
            <button onclick="logout()" class="p-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white transition-colors">
                <i class="fas fa-sign-out-alt"></i>
            </button>
        </div>

        <div class="glass border border-slate-800/50 rounded-3xl p-6 md:p-8 shadow-2xl">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-500">
                    <i class="fas fa-key"></i>
                </div>
                <h2 class="text-lg font-semibold text-white">Generate License</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-slate-500 ml-1">Duration (Days)</label>
                    <input type="number" id="duration" placeholder="e.g. 30" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500/50 transition-all">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] uppercase font-bold text-slate-500 ml-1">Device Limit</label>
                    <input type="number" id="limit" value="1" 
                           class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white outline-none focus:border-blue-500/50 transition-all">
                </div>
            </div>
            
            <button onclick="generateKey()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-2xl font-bold text-xs uppercase tracking-widest shadow-lg shadow-blue-500/20 transition-all active:scale-[0.98]">
                Generate License Key
            </button>
        </div>

        <div class="glass border border-slate-800/50 rounded-3xl p-6 md:p-8 shadow-2xl">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-500">
                        <i class="fas fa-users"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-white">Active Licenses</h2>
                </div>

                <div class="flex items-center gap-2 bg-slate-950 border border-slate-800 p-1.5 rounded-xl">
                    <input id="globalMsg" type="text" placeholder="Global Notification..." 
                           class="bg-transparent border-none px-3 py-1 text-xs text-white outline-none w-40 md:w-56">
                    <button onclick="sendGlobalNotif()" class="bg-slate-800 hover:bg-blue-600 text-white px-4 py-1.5 rounded-lg text-[10px] font-bold transition-all uppercase tracking-wider">
                        Send
                    </button>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-800">
                            <th class="pb-4 font-semibold uppercase text-[10px]">Key String</th>
                            <th class="pb-4 font-semibold uppercase text-[10px]">Usage</th>
                            <th class="pb-4 font-semibold uppercase text-[10px]">Account Status</th>
                            <th class="pb-4 text-right font-semibold uppercase text-[10px]">Manage</th>
                        </tr>
                    </thead>
                    <tbody id="keyList" class="divide-y divide-slate-800/50">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/manage';
        const secret = localStorage.getItem('admin_secret');

        if (!secret) window.location.href = '/login.html';

        async function fetchKeys() {
            const res = await fetch(API_BASE, { headers: { 'x-admin-secret': secret } });
            if (res.status === 401) logout();
            const data = await res.json();
            const list = document.getElementById('keyList');
            list.innerHTML = data.keys.map(k => `
                <tr class="group hover:bg-slate-800/20 transition-colors">
                    <td class="py-4 font-mono text-xs text-blue-400 font-medium">${k.key}</td>
                    <td class="py-4 text-xs text-slate-400">${k.used} / ${k.limit}</td>
                    <td class="py-4">
                        <span onclick="togglePremium('${k.key}')" class="cursor-pointer px-2 py-1 rounded-full text-[9px] font-bold ${k.isPremium ? 'bg-green-500/10 text-green-500 border border-green-500/20' : 'bg-slate-800 text-slate-500'}">
                            ${k.isPremium ? '★ PREMIUM' : 'PENDING'}
                        </span>
                    </td>
                    <td class="py-4 text-right">
                        <button onclick="deleteKey('${k.key}')" class="text-slate-600 hover:text-red-500 transition-colors p-2">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function generateKey() {
            const duration = document.getElementById('duration').value;
            const limit = document.getElementById('limit').value;
            if(!duration) return alert("Enter duration");

            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
                body: JSON.stringify({ duration, limit })
            });
            if (res.ok) { fetchKeys(); document.getElementById('duration').value = ''; }
        }

        async function togglePremium(key) {
            await fetch(API_BASE, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
                body: JSON.stringify({ key })
            });
            fetchKeys();
        }

        async function deleteKey(key) {
            if (!confirm('Delete this license?')) return;
            await fetch(\`\${API_BASE}?key=\${key}\`, {
                method: 'DELETE',
                headers: { 'x-admin-secret': secret }
            });
            fetchKeys();
        }

        async function sendGlobalNotif() {
            const msg = document.getElementById('globalMsg').value;
            const res = await fetch(API_BASE, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-secret': secret },
                body: JSON.stringify({ action: 'broadcast', message: msg })
            });
            if (res.ok) alert("Global Message Updated!");
        }

        function logout() {
            localStorage.removeItem('admin_secret');
            window.location.href = '/login.html';
        }

        fetchKeys();
        setInterval(fetchKeys, 30000);
    </script>
</body>
</html>
