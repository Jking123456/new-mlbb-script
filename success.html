<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINZVAN | Success</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#0b0f1a] text-white flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-gray-900/50 border border-white/10 p-8 rounded-[32px] text-center backdrop-blur-xl">
        <i class="fa-solid fa-circle-check text-5xl text-green-500 mb-6"></i>
        <h1 class="text-2xl font-bold mb-4">Key Generated!</h1>
        <div id="keyBox" class="bg-blue-500/10 border border-blue-500/30 p-4 rounded-xl font-mono text-xl mb-6 select-all cursor-pointer">
            Loading...
        </div>
        <button onclick="copyKey()" class="w-full bg-blue-600 py-4 rounded-xl font-bold">COPY KEY</button>
    </div>

    <script>
        // Get key from URL: ?key=PRZ-FREE-XXXX
        const urlParams = new URLSearchParams(window.location.search);
        const key = urlParams.get('key');
        if (key) document.getElementById('keyBox').innerText = key;

        function copyKey() {
            navigator.clipboard.writeText(key);
            alert("Key copied!");
        }
    </script>
</body>
</html>
