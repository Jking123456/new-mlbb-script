<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINZVAN | Verify Access</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0f1a; color: #f8fafc; font-family: 'Inter', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-6">
    <div class="w-full max-w-md">
        <div class="glass rounded-[32px] p-8 text-center shadow-2xl">
            <div id="step1">
                <i class="fa-solid fa-shield-check text-5xl text-blue-500 mb-6"></i>
                <h1 class="text-2xl font-bold mb-4">Link Verified</h1>
                <p class="text-slate-400 text-sm mb-8">Click the button below to reveal your 24h License Key.</p>
                <button onclick="revealKey()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition-all shadow-lg shadow-blue-500/20">
                    REVEAL MY KEY
                </button>
            </div>

            <div id="step2" class="hidden">
                <i class="fa-solid fa-key text-5xl text-green-500 mb-6"></i>
                <h1 class="text-2xl font-bold mb-2">Your License Key</h1>
                <p class="text-slate-400 text-xs mb-8">Copy this key and paste it into the script.</p>
                <div id="keyDisplay" class="bg-white/5 border border-white/10 p-4 rounded-2xl font-mono text-xl mb-6 text-blue-400 tracking-widest">
                    -------
                </div>
                <button onclick="copyKey()" class="w-full bg-slate-800 text-white font-bold py-4 rounded-xl transition-all">
                    COPY TO CLIPBOARD
                </button>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const key = urlParams.get('key');

        function revealKey() {
            if (!key) return alert("No key found in URL.");
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
            document.getElementById('keyDisplay').innerText = key;
        }

        function copyKey() {
            navigator.clipboard.writeText(key);
            alert("Key copied successfully!");
        }
    </script>
</body>
</html>
