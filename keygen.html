<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINZVAN | Get Free Key</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0b0f1a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-glow { 
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.4);
        }
    </style>
</head>
<body class="flex items-center justify-center min-height-screen p-6">
    <div class="w-full max-w-md mt-20">
        <div class="glass rounded-[32px] p-8 text-center shadow-2xl">
            <div class="w-20 h-20 bg-blue-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-key text-3xl text-blue-500"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">Free 24h Access</h1>
            <p class="text-slate-400 text-sm mb-8">Complete the shortlink to generate your unique license key.</p>

            <div class="space-y-4">
                <div class="bg-white/5 p-4 rounded-2xl text-left">
                    <div class="flex items-center gap-3 text-xs text-slate-400 mb-1">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>RULES</span>
                    </div>
                    <ul class="text-[11px] text-slate-500 space-y-1">
                        <li>• Valid for 1 Device only</li>
                        <li>• Duration: 24 Hours from first use</li>
                        <li>• Do not use VPN/Adblock on link</li>
                    </ul>
                </div>

                <button onclick="getLink()" id="genBtn" class="w-full btn-glow text-white font-bold py-4 rounded-xl transition-all active:scale-95">
                    GENERATE SHORTLINK
                </button>
            </div>

            <p class="text-[10px] text-slate-600 mt-8 tracking-widest uppercase">Prinzvan Ultimate Protection</p>
        </div>
    </div>

    <script>
        async function getLink() {
            const btn = document.getElementById('genBtn');
            btn.innerText = "GENERATING...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/keygen', { method: 'POST' });
                const data = await res.json();
                if (data.shortlink) {
                    window.location.href = data.shortlink;
                } else {
                    alert("System Busy. Try again later.");
                    btn.innerText = "GENERATE SHORTLINK";
                    btn.disabled = false;
                }
            } catch (e) {
                alert("Connection Error.");
                btn.innerText = "GENERATE SHORTLINK";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
