<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporarily Unavailable | Prinzvan Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
        }
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="animated-bg min-h-screen flex flex-col items-center justify-center font-sans p-6">

    <main class="glass max-w-lg w-full rounded-3xl shadow-2xl p-10 text-center transform transition-all hover:scale-[1.01]">
        <div class="mb-6 flex justify-center">
            <div class="bg-gray-100 p-4 rounded-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-gray-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
            </div>
        </div>

        <h1 class="text-3xl font-extrabold text-gray-800 mb-4 tracking-tight">
            Temporarily Unavailable
        </h1>
        
        <p class="text-gray-600 leading-relaxed mb-8">
            We are currently performing scheduled maintenance to improve our services. 
            <span class="font-semibold text-gray-800">Prinzvan Official</span> will be back online shortly. 
            We appreciate your patience!
        </p>

        <div class="w-full bg-gray-200 rounded-full h-1.5 mb-8">
            <div class="bg-blue-500 h-1.5 rounded-full" style="width: 75%"></div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="mailto:support@prinzvan.com" class="px-6 py-2 bg-gray-800 text-white rounded-lg font-medium hover:bg-black transition-colors">
                Contact Support
            </a>
            <button onclick="window.location.reload()" class="px-6 py-2 border border-gray-300 rounded-lg font-medium hover:bg-gray-50 transition-colors">
                Check Again
            </button>
        </div>
    </main>

    <footer class="mt-12 text-white text-sm font-light tracking-widest opacity-90">
        &copy; Prinzvan Official 2026
    </footer>

</body>
</html>
